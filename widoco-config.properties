description=Models proverbs, their unspoken lessons, the situations they're used in, and cross-cultural equivalences between proverbs that share a lesson but diverge in imagery.
introduction=Proverbs are a clear case of tacit knowledge in language: the literal words are not the point — the point is the unspoken lesson the phrase is used to teach. Two cultures can arrive at the same lesson through completely different imagery, or use the same image to teach something else entirely. PROTO gives that structure a formal shape by separating a proverb's surface form (:Proverb) from its tacit lesson (:TacitLesson), its literal source domain (:SourceDomain), the situation in which it is used (:SituationOfUse), and the cross-cultural equivalence relations that connect proverbs across languages (:CrossCulturalEquivalence), typed via a small controlled vocabulary (:EquivalenceType) that distinguishes same-lesson/different-image matches from direct matches, false friends, and partial overlaps. The knowledge base is generated from a shared, Wikidata-grounded spreadsheet via an open conversion script.
authors=Sevda Rezaei Melal, Polyxeni Chasanai, Saba Afsharzadehtorghab, Claudia Briccolani
